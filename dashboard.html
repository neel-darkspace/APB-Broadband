<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | APB Broadband</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar: #0e1a35; --bg: #f4f7f6; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 30px 20px; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="text-align:center; margin-bottom:40px;">
            <i class="fas fa-user-circle" style="font-size:50px; color:var(--accent);"></i>
            <h3>SUPER ADMIN</h3>
        </div>
        <nav>
            <a href="#" style="color:var(--accent); text-decoration:none;"><i class="fas fa-th"></i> Dashboard</a><br><br>
            <a href="index.html" class="logout-link" style="color:#ff5e5e; text-decoration:none;"><i class="fas fa-power-off"></i> Logout</a>
        </nav>
    </div>

    <div class="main">
        <h1>Dashboard Overview</h1>
        <div class="panel" style="margin-top:20px;">
            <h3>System Security Status: <span style="color:green;">Connected</span></h3>
            <p style="margin-top:10px; color:#666;">
                1. <b>Auto-Logout on Refresh:</b> Active[cite: 1]<br>
                2. <b>2-Minute Idle Timeout:</b> Active[cite: 1]
            </p>
        </div>
    </div>

    <script>
        // REDIRECT ON REFRESH: Immediately sends user to login if they reload[cite: 1]
        if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
            window.location.href = "index.html";
        }

        // 2-MINUTE IDLE TIMEOUT: Tracks inactivity and redirects[cite: 1]
        let idleTime = 0;
        setInterval(() => {
            idleTime++;
            if (idleTime >= 120) { // 120 seconds = 2 minutes
                alert("Session expired due to inactivity.");
                window.location.href = "index.html";
            }
        }, 1000);

        // Reset timer on user interaction[cite: 1]
        document.onmousemove = document.onkeypress = document.onclick = () => idleTime = 0;
    </script>
</body>
</html>
