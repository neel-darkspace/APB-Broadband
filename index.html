<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | APB Broadband</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 850px;
            height: 480px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            display: flex;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .left-panel {
            flex: 1.2;
            padding: 45px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
        }

        .right-panel {
            flex: 1;
            padding: 45px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand { font-size: 1.6em; font-weight: bold; color: #00d4ff; }
        
        .input-box {
            position: relative;
            margin: 25px 0;
            border-bottom: 2px solid #fff;
        }

        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 0;
            color: white;
            font-size: 1em;
        }

        .input-box i {
            position: absolute;
            right: 5px;
            bottom: 10px;
            opacity: 0.8;
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #c61d41;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .social-icons i {
            margin-right: 15px;
            font-size: 1.2em;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Brand Info -->
        <div class="left-panel">
            <div class="brand">APB Broadband</div>
            <div>
                <h1 style="font-size: 2.5em;">Welcome!</h1>
                <p style="margin-top: 5px;">To APB Management Studio.</p>
                <p style="font-size: 0.8em; margin-top: 15px; opacity: 0.7;">
                    Access your administrative dashboard and network management tools.
                </p>
            </div>
            <div class="social-icons">
                <i class="fab fa-linkedin"></i>
                <i class="fab fa-facebook-square"></i>
                <i class="fab fa-instagram"></i>
                <i class="fab fa-twitter"></i>
            </div>
        </div>

        <!-- Login Form -->
        <div class="right-panel">
            <h2 style="text-align: center; margin-bottom: 20px;">Sign In</h2>
            
            <form action="login_handler.aspx" method="post">
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class="fas fa-lock"></i>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 20px;">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" style="color: white; text-decoration: none;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>
            </form>
            
            <p style="text-align: center; font-size: 0.8em; margin-top: 25px;">
                Don't have an account? <a href="#" style="color: white; font-weight: bold;">Sign up</a>
            </p>
        </div>
    </div>

</body>
</html>
