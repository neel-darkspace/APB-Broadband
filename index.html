<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | APB Broadband</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card { width: 850px; height: 480px; background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 15px; display: flex; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .left { flex: 1.2; padding: 45px; color: white; display: flex; flex-direction: column; justify-content: space-between; background: rgba(0,0,0,0.2); }
        .right { flex: 1; padding: 45px; color: white; display: flex; flex-direction: column; justify-content: center; }
        .brand { font-size: 1.6em; font-weight: bold; color: #00d4ff; }
        .input-box { position: relative; margin: 25px 0; border-bottom: 2px solid #fff; }
        .input-box input { width: 100%; background: transparent; border: none; outline: none; padding: 10px 0; color: white; }
        .input-box i { position: absolute; right: 5px; bottom: 10px; }
        .btn { width: 100%; padding: 12px; background: #c61d41; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="left">
            <div class="brand">APB Broadband</div>
            <div><h1>Welcome!</h1><p>APB Management Studio</p></div>
            <div class="socials"><i class="fab fa-linkedin"></i> <i class="fab fa-facebook"></i></div>
        </div>
        <div class="right">
            <h2 style="text-align:center; margin-bottom:20px;">Portal Sign In</h2>
            <form action="login_handler.aspx" method="post">
                <div class="input-group input-box">
                    <input type="text" name="username" placeholder="Username" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-group input-box">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
